# Streamlit's built-in widgets — slider tracks and handles, checkbox and radio
# fills, spinners, focus rings — are painted with primaryColor, and none of that
# is reachable from the stylesheet in app.py. Left at the default #FF4B4B they
# came out tomato red on an otherwise violet page, which is exactly the kind of
# detail that makes a product look assembled rather than designed.
[theme]
primaryColor = "#7c3aed"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"

[client]
toolbarMode = "minimal"
